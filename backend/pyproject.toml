[project]
name = "agentic-paper-trader-backend"
version = "0.1.0"
description = "FastAPI backend for the Agentic Paper Trader"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "email-validator>=2.2",
    "httpx>=0.27",
    "pandas>=2.2",
    "python-multipart>=0.0.12",
    "openai>=1.50",
    "alpaca-py>=0.30",
    "cryptography>=43.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.12",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"
markers = [
    "integration: tests that require live external services (e.g. a running Ollama instance); excluded from default CI.",
]

[tool.coverage.run]
# Measure coverage of the application package only (not tests or site-packages).
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
# No hard fail yet — a baseline threshold will be agreed before enabling fail_under.
skip_covered = false

[tool.coverage.xml]
output = "coverage.xml"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Long lines here are inside the literal LLM system prompt text, not code structure;
# wrapping them would change what's actually sent to the model.
"app/agent/prompt.py" = ["E501"]
# SQLAlchemy declarative mapped_column() / constraint definitions read best as single
# lines; wrapping them hurts the readability of the model schema. Allow long lines here.
"app/db/models.py" = ["E501"]
