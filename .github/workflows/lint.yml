name: Lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ruff:
    name: Ruff (Python lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: pip install "ruff>=0.12"

      # Lint the whole backend (all app/ packages + tests). Intentional
      # exceptions are expressed in backend/pyproject.toml via per-file-ignores,
      # not by narrowing this scope.
      - name: Ruff check
        run: ruff check app tests

  mypy:
    name: mypy (Python type check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install backend (with dev deps)
        run: pip install -e ".[dev]"

      - name: mypy check
        run: mypy
