name: Keep production API awake

# Render's free web service sleeps after ~15 minutes without inbound requests, and
# scheduled ticks only make outbound calls, so they don't keep it awake (#184).
# This pings GET /health every 10 minutes on weekdays during US market hours.
# Cron is in UTC: 13:00-21:59 UTC covers 9:00-16:30 ET in both EST and EDT.
# GitHub can delay scheduled runs; if Render still sleeps, lower the interval to */5.

on:
  schedule:
    - cron: "*/10 13-21 * * 1-5"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /health
        env:
          API_BASE_URL: ${{ vars.PRODUCTION_API_BASE_URL }}
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "Set the PRODUCTION_API_BASE_URL repository variable first." >&2
            exit 1
          fi
          # A cold start can take up to a minute, so retry before failing.
          curl --fail --silent --show-error --retry 5 --retry-delay 10 \
            --retry-all-errors --max-time 90 "$API_BASE_URL/health"